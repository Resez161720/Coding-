# การตั้งค่าระบบช่วยพิมพ์ Tag
# แก้ไฟล์นี้ด้วย Notepad แล้วปิด-เปิดโปรแกรมใหม่

# "demo"  = โหมดทดลอง ใช้จอเขียวจำลอง ไม่แตะ AS/400 (ใช้ฝึกคนพิมพ์)
# "pcomm" = ต่อกับจอเขียวจริง (IBM Personal Communications / iSeries Access for Windows)
mode = "demo"

# ชื่อ session ของจอเขียว (ตัวอักษรที่ขึ้นมุมล่างซ้ายของหน้าต่างจอเขียว ปกติคือ A)
session = "A"

# หน้าเว็บของโปรแกรม (เปิดได้เฉพาะในเครื่องนี้)
host = "127.0.0.1"
port = 8765

# โฟลเดอร์ตารางข้อมูล (machines.csv, operators.csv, carts.csv) และฐานข้อมูล
data_dir = "data"

# สีกระดาษที่ใช้ (ชื่อต้องตรงกับคอลัมน์ color ใน machines.csv)
colors = ["ชมพู", "เขียว"]

# เวลาเริ่มของแต่ละกะ (กะจบเมื่อกะถัดไปเริ่ม) ต้องแก้ให้ตรงกับโรงงาน
[shifts]
A = "08:00"
B = "16:00"
C = "00:00"

# (ไม่บังคับ) รหัส process -> สีกระดาษ ใช้ตรวจซ้ำที่หน้า DTNOG1L2
# ถ้าประเภทงานบนจอต้องใช้สีอื่น โปรแกรมจะหยุดให้เปลี่ยนกระดาษ
[process_colors]
# "0010" = "ชมพู"

[options]
# ให้คนพิมพ์กดยืนยันทุกใบก่อน Enter หน้าสุดท้าย (เปิดไว้ช่วงทดลองใช้จริง)
confirm_before_final_enter = true
# จำนวนที่แยก lot (LOT M/O QTY) = จำนวนดี + NG
lot_qty_includes_ng = true
# รอจอเขียวตอบได้นานสุดกี่วินาทีต่อการกดปุ่ม
step_timeout_seconds = 15
# ปุ่มที่กดเพื่อกลับหน้า DEP012G1 หลังพิมพ์เสร็จ ถ้าจอไม่กลับเอง (เช่น ["pf1"])
# เว้นว่าง = ให้คนพิมพ์พาจอกลับเอง
home_keys = []

# รูปแบบ barcode ของเอกสารเดิม (regular expression)
[barcodes]
work_order = '^(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\d{2}[A-Z0-9]{2,4}$'
mat_do = '^OP[0-9A-Z]{8,14}$'
mat_coil = '^OF[0-9A-Z]{8,14}$'
die = '^DIE\.\d{1,3}$'
